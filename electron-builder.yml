appId: be.herczeg.agentos
# No auto-update feed: releases are downloaded from GitHub by hand.
publish: null
productName: AgentOS
directories:
  buildResources: build
  output: release

files:
  - out/**
  - package.json
  - "!**/*.map"
  # The SDK ships a native CLI per platform, hundreds of megabytes each. AgentOS uses the
  # machine's own Claude Code instead, exactly as it uses the machine's git.
  - "!node_modules/@anthropic-ai/claude-agent-sdk-*/**"

linux:
  syncDesktopName: true
  target:
    - AppImage
    - deb
  category: Development
  synopsis: A unified, purpose-built interface to interact with agents safely

win:
  target: nsis

mac:
  # Ad-hoc signing, explicitly: with no certificate in the keychain electron-builder signs
  # nothing at all, and an unsigned arm64 app is refused outright as "damaged". The hardened
  # runtime is off because it buys nothing without notarisation and breaks an ad-hoc signature.
  identity: "-"
  hardenedRuntime: false
  # Both architectures, so Intel Macs are not left out by the runner's own arch.
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.developer-tools

nsis:
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
